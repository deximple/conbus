[package]
name = "conbus"
description = "A conversation bus for coding agents."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "conbus"
path = "src/main.rs"

[dependencies]
conbus-core.workspace = true
libc.workspace = true
serde.workspace = true
# `preserve_order`: install and uninstall rewrite files that belong to the
# person — Claude's settings.json, Codex's and Cursor's hooks.json — and a
# rewrite that sorts their keys is not leaving their file alone.
serde_json = { workspace = true, features = ["preserve_order"] }
ed25519-dalek = { version = "2.1", default-features = false, features = ["alloc", "zeroize"] }
getrandom = "0.2"
sha2 = "0.10"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "2.11"

[dev-dependencies]
ed25519-dalek = { version = "2.1", default-features = false, features = ["alloc", "zeroize"] }
serde_json.workspace = true
tempfile.workspace = true
