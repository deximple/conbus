[package]
name = "conbus"
description = "A conversation bus for coding agents."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "conbus"
path = "src/main.rs"

[dependencies]
conbus-core.workspace = true
libc.workspace = true
serde.workspace = true
# `preserve_order`: install and uninstall rewrite files that belong to the
# person — Claude's settings.json, Codex's and Cursor's hooks.json — and a
# rewrite that sorts their keys is not leaving their file alone.
serde_json = { workspace = true, features = ["preserve_order"] }

[dev-dependencies]
serde_json.workspace = true
tempfile.workspace = true
