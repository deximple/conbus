# The gate every change passes before it reaches main: the same three commands
# the project's own rules name — fmt, clippy with warnings as errors, and the
# whole suite. PRs #11–#18 were merged without it and main went red for a day
# without anyone knowing; this is the machine saying so instead.
#
# macOS only, because conbus is: launchd, AF_UNIX path limits and the vendor
# apps it lands in are macOS facts. First-party actions only, and the toolchain
# comes from rustup on the runner rather than a third-party action.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.94.1"
  # Install paths under test must never talk to the runner's launchd.
  CONBUS_SKIP_LAUNCHCTL: "1"

jobs:
  gate:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt,clippy
          rustup default "$RUST_TOOLCHAIN"
          rustc --version

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-

      - name: fmt
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: test
        run: cargo test --workspace --locked --no-fail-fast
